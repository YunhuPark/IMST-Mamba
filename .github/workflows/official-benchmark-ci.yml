name: Official Challenge Benchmark CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/official-challenge-benchmark]

permissions:
  contents: read

jobs:
  benchmark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn torch pytest
          python -m pip check
      - name: Compile benchmark code
        run: python -m compileall -q src/ scripts/benchmark_official_six_vitals.py tests/test_official_challenge_contract.py
      - name: Run benchmark contract tests
        run: python -m pytest tests/test_official_challenge_contract.py -q
